name: Build Zorbix FPS Boost V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Find project directory
        run: |
          echo "Project contents:"
          find project -maxdepth 3 -type f | head -50

      - name: Build mod
        working-directory: project
        run: |
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Zorbix-FPS-Boost-V2
          path: project/build/libs/*.jar
