name: Build Zorbix FPS Boost V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Build mod
        run: |
          PROJECT_DIR=$(find project -name "settings.gradle" -type f -print -quit | xargs dirname)

          echo "======================================"
          echo "Zorbix project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          cd "$PROJECT_DIR"

          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Zorbix-FPS-Boost-V2
          path: project/**/build/libs/*.jar
